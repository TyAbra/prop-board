<title>NBA Prop Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root {
  --bg: #F1F4EF; --surface: #FFFFFF; --line: #D3DACF; --ink: #15201A; --muted: #59665D; --accent: #1B6A45; --bad: #B3261B;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0D1210; --surface: #141B17; --line: #2A352E; --ink: #E3EAE4; --muted: #92A096; --accent: #5CC290; --bad: #F2887C; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
h1 { font: 700 2.6rem/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; }
p { margin: 0; color: var(--muted); }
input[type="password"] { font: inherit; font-size: 17px; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
button { font: 700 1.2rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 14px; border-radius: 999px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
button[disabled] { opacity: .6; }
#err { color: var(--bad); min-height: 1.45em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

</form>

const KEY = "propboard:key";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256);
}
async function unlock(bits) {
  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const raw = b64(BLOB);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
  return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { show(await unlock(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  }
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Opening…"; err.textContent = "";
  try {
    const bits = await derive(document.getElementById("pw").value.trim());
    const html = await unlock(bits);
    if (document.getElementById("keep").checked) { try { localStorage.setItem(KEY, toB64(bits)); } catch (e2) {} }
    show(html);
  } catch (x) {
    err.textContent = "That password didn't work. Check the text you were sent.";
    go.disabled = false; go.textContent = "Open board";
  }
});
